name: fetch
defaults:
    run:
        shell: bash --noprofile --norc -o errexit -o nounset -o pipefail -o xtrace {0}
env:
    # https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
    fetch:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: jdx/mise-action@v3
              with:
                  experimental: true
            - name: fetch episode
              env:
                  EPISODE_NUMBER: ${{ inputs.episode_number }}
                  R2_URL: ${{ secrets.R2_URL || 'off' }}
              run: |
                  # keep in sync with the schedule cron below
                  .venv/bin/python -m manage fetch_podcast_episode --period-minutes=360 \
                      ${EPISODE_NUMBER:+--episode-number "$EPISODE_NUMBER"}

on: # yamllint disable-line rule:truthy
    schedule:
        - cron: '48 */6 * * *' # 4 a day from 00:48 UTC; keep in sync with --period-minutes
    workflow_dispatch:
        inputs:
            episode_number:
                description: Chronological episode number; blank fetches the oldest missing
                required: false

run-name: Fetching on behalf of ${{ github.actor }}
